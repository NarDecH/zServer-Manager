name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build self-test
        run: dotnet build tools/ZServer.SelfTest/ZServer.SelfTest.csproj -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/ZServer.Manager/ZServer.Manager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZServerManager
          path: bin/ZServerManager.exe
